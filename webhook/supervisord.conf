; 用 manage.py 启动和管理服务，它会读取 runtime/.env 配置。

; 创建本机管理入口，让管理命令能联系 Supervisor。
[unix_http_server]
file=%(here)s/runtime/run/supervisor.sock
chmod=0600

; Supervisor 自己的工作目录、日志和进程编号。
[supervisord]
directory=%(here)s
logfile=%(here)s/runtime/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/runtime/run/supervisord.pid
umask=0077

; 启用查询状态、停止程序等管理功能。
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; 告诉管理命令去哪里连接 Supervisor。
[supervisorctl]
serverurl=unix://%(here)s/runtime/run/supervisor.sock

; 接收服务：接收 Webhook 通知，把任务存入数据库。
[program:issue-gov-webhook]
directory=%(here)s
; 启动 Gunicorn，调用 receiver.create_app() 创建接收应用。
; 监听 runtime/.env 的 WEBHOOK_PORT（默认 7000），用 2 个 HTTP 工作进程处理。
; 工作进程超过 30 秒无响应就重启；错误日志交给 Supervisor 收集。
command="%(ENV_WEBHOOK_PYTHON)s" -m gunicorn --bind 0.0.0.0:%(ENV_WEBHOOK_PORT)s --workers 2 --timeout 30 --error-logfile - receiver:create_app()
autorestart=true
startsecs=3
; 正常停止只通知 Gunicorn 主进程，由它关闭子进程；超时再强制清理整个进程组。
stopsignal=TERM
stopasgroup=false
killasgroup=true
stopwaitsecs=40
redirect_stderr=true
stdout_logfile=%(here)s/runtime/logs/webhook.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; 处理服务：反复查询数据库，取出待处理任务，在服务器执行检查和评论。
[program:issue-gov-worker]
directory=%(here)s
; 用 Python 执行 -c 后的代码：读取配置，再进入 run_worker() 的处理循环。
command="%(ENV_WEBHOOK_PYTHON)s" -c "from receiver import Config; from worker import run_worker; run_worker(Config.from_file())"
autorestart=true
startsecs=3
stopasgroup=true
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=%(here)s/runtime/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
