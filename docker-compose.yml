# 接收服务、消费者、PostgreSQL 和 RabbitMQ。
# 环境文件是 issue-gov-agent/.env。部署优先直接执行：
#   docker compose --env-file issue-gov-agent/.env up -d --build
# 并导出 CONTAINER_UID、CONTAINER_GID，否则容器用户落到 1000:1000。
# 容器进程只额外设置 SERVICE_MODE=queue；服务用这份文件里的账号和口令拼出连接串。
# 消费者副本数见 consumer.deploy.replicas。灰度机器的 /opt/CommunityGovAgent/docker-compose.yml 保持同一数字。

name: issue-gov

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 issue-gov-agent/.env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 issue-gov-agent/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 issue-gov-agent/.env 中设置 POSTGRES_DB}
    volumes:
      - issue_gov_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # 调试端口只绑本机回环；生产环境禁止把数据库直接暴露到公网。
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    mem_limit: 512m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请在 issue-gov-agent/.env 中设置 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 issue-gov-agent/.env 中设置 RABBITMQ_PASSWORD}
    volumes:
      - issue_gov_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    ports:
      # 调试端口只绑本机回环；管理页面如需远程访问请走 SSH 隧道。
      - "127.0.0.1:${RABBITMQ_PORT:-56729}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    mem_limit: 512m
    restart: unless-stopped

  receiver:
    build:
      context: .
      dockerfile: issue-gov-agent/Dockerfile
      target: receiver
    init: true
    # 应用容器以运行 scripts/service 的用户身份运行（CONTAINER_UID/CONTAINER_GID 由该脚本导出），
    # 与 manage.py init 生成的 0600 配置文件属主一致。直接执行 docker compose 时需自行导出这两个变量，
    # 或显式指定 user，例如 user: "1001:1001"。
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      SERVICE_MODE: queue
      WEBHOOK_PORT: "7000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - ./issue-gov-agent/.env:/app/.env:ro
      - ./issue-gov-agent/repository.yml:/app/repository.yml:ro
    ports:
      - "${WEBHOOK_PORT:-7000}:7000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

  consumer:
    # 副本数在这里改，然后执行 docker compose up -d。
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: issue-gov-agent/Dockerfile
      target: consumer
    init: true
    # 与 receiver 相同：按运行 scripts/service 的用户身份读取 0600 的 .env 和 repository.yml。
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      SERVICE_MODE: queue
      CONSUMER_HEALTH_PORT: "7001"
      # 该用户在镜像里没有 passwd 条目，claude 子进程和 tempfile 需要一个可写的 HOME。
      HOME: /tmp
    volumes:
      - ./issue-gov-agent/.env:/app/.env:ro
      - ./issue-gov-agent/repository.yml:/app/repository.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 40s
    mem_limit: 768m
    restart: unless-stopped

volumes:
  issue_gov_postgres:
  issue_gov_rabbitmq:
